<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王秀宁《高级网页设计》课堂实践</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #25233a;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #f2f0ff, #fff5fa);
    }

    header {
      padding: 75px 20px 110px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #5148bf, #a26bd8);
      clip-path: ellipse(100% 72% at 50% 25%);
    }

    header h1 {
      margin: 20px 0 12px;
      font-size: clamp(30px, 6vw, 56px);
      letter-spacing: 3px;
    }

    header p {
      font-size: 17px;
      opacity: .9;
    }

    .wang_badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 999px;
      letter-spacing: 2px;
    }

    main {
      width: min(1100px, 92%);
      margin: -45px auto 60px;
    }

    .wang_intro,
    .wang_prompt {
      padding: 28px;
      margin-bottom: 26px;
      border-radius: 24px;
      background: rgba(255,255,255,.85);
      box-shadow: 0 18px 45px rgba(68,55,140,.14);
    }

    .wang_intro {
      color: #747188;
      text-align: center;
      line-height: 2;
    }

    .wang_title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 25px 0 18px;
    }

    .wang_title-row h2 {
      font-size: 25px;
    }

    #wang_search {
      width: 260px;
      max-width: 100%;
      padding: 12px 18px;
      border: 1px solid #dedaf3;
      border-radius: 999px;
      outline: none;
      font-size: 14px;
    }

    #wang_search:focus {
      border-color: #6257d9;
      box-shadow: 0 0 0 4px rgba(98,87,217,.12);
    }

    .wang_page-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .wang_page-card {
      display: flex;
      flex-direction: column;
      min-height: 175px;
      padding: 25px;
      color: #25233a;
      text-decoration: none;
      border: 1px solid #eeeafa;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 25px rgba(68,55,140,.08);
      transition: .25s ease;
    }

    .wang_page-card:hover {
      color: #fff;
      transform: translateY(-7px);
      background: linear-gradient(135deg, #6257d9, #9b8cff);
      box-shadow: 0 18px 30px rgba(98,87,217,.28);
    }

    .wang_icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #6257d9, #9b8cff);
      font-size: 22px;
    }

    .wang_page-card:hover .wang_icon {
      background: rgba(255,255,255,.2);
    }

    .wang_page-card h3 {
      margin-bottom: 12px;
      font-size: 19px;
    }

    .wang_page-card span {
      margin-top: auto;
      color: #858198;
      font-size: 13px;
    }

    .wang_page-card:hover span {
      color: rgba(255,255,255,.85);
    }

    .wang_prompt h2 {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .wang_prompt p {
      padding: 16px;
      color: #5c5872;
      line-height: 1.8;
      border-left: 4px solid #6257d9;
      background: #f7f6ff;
      word-break: break-all;
    }

    footer {
      padding: 25px;
      color: #747188;
      text-align: center;
      font-size: 14px;
    }

    .wang_empty {
      grid-column: 1 / -1;
      padding: 35px;
      color: #747188;
      text-align: center;
    }

    @media (max-width: 600px) {
      .wang_title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      #wang_search {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wang_badge">CLASS PRACTICE</div>
    <h1>高级网页设计</h1>
    <p>王秀宁课堂实践作品集</p>
  </header>

  <main>
    <section class="wang_intro">
      <p>
        欢迎来到王秀宁《高级网页设计》课堂实践导航页。<br>
        以下为本目录中的网页作品，点击卡片将在新窗口打开对应页面。
      </p>
    </section>

    <div class="wang_title-row">
      <h2>网页作品导航</h2>
      <input id="wang_search" type="search" placeholder="搜索作品名称或文件名">
    </div>

    <section class="wang_page-list" id="wang_pageList"></section>

    <section class="wang_prompt">
      <h2>本页面提示词</h2>
      <p>
        创建一个新页面，包括本目录下的所有网页的超链接，使用原生代码，不使用cdn，新页面名称为index.html，主题为王秀宁的《高级网页设计》课堂实践，美化页面，页面中包括本提示词，把作品名改成每个文件h2中的内容，每个网页超链接要target="_blank"
      </p>
    </section>
  </main>

  <footer>
    © <span id="wang_year"></span> 王秀宁《高级网页设计》课堂实践
  </footer>

  <script>
    const wang_pages = [
      {
        file: "./1.html",
        title: "629 王秀宁",
        icon: "✦"
      },
      {
        file: "./2.html",
        title: "超链接",
        icon: "◆"
      },
      {
        file: "./3.html",
        title: "表单",
        icon: "●"
      },
      {
        file: "./4.html",
        title: "图层样式表css",
        icon: "✧"
      },
        {
        file: "./5.html",
        title: "css群组选择器和后代选择器",
        icon: "✧"
      },
      {
        file: "./7-1.html",
        title: "盒模型，框模型，box model",
        icon: "▣"
      },
      {
        file: "./7.html",
        title: "层叠与继承",
        icon: "▤"
      },
      {
        file: "./8-2.html",
        title: "王秀宁的标题",
        icon: "▧"
      },
      {
        file: "./8.html",
        title: "王秀宁的flex",
        icon: "▦"
      },
      {
        file: "./9.html",
        title: "css3",
        icon: "◈"
      },
      {
        file: "./10.html",
        title: "transaction 过渡",
        icon: "◉"
      },
      {
        file: "./11-1.html",
        title: "背景颜色动画",
        icon: "◐"
      },
      {
        file: "./11-2.html",
        title: "CSS Animation 幻灯片",
        icon: "▶"
      },
      {
        file: "./11-3.html",
        title: "媒体查询与视口变化",
        icon: "◑"
      },
      {
        file: "./11-4.html",
        title: "Media Query 响应式布局",
        icon: "▦"
      },
      {
        file: "./12-1.html",
        title: "前端长度单位",
        icon: "↔"
      },
      {
        file: "./12-2.html",
        title: "CSS3 3D 动画",
        icon: "◈"
      },
      {
        file: "./12-3.html",
        title: "3D 立体菜单与透视效果",
        icon: "▣"
      },
      {
        file: "./13-1.html",
        title: "CSS 变量（自定义属性）",
        icon: "◌"
      }
    ];

    const wang_pageList = document.getElementById("wang_pageList");
    const wang_search = document.getElementById("wang_search");

    function wang_renderPages(wang_keyword = "") {
      const wang_filteredPages = wang_pages.filter(wang_page =>
        wang_page.title.toLowerCase().includes(wang_keyword.toLowerCase()) ||
        wang_page.file.toLowerCase().includes(wang_keyword.toLowerCase())
      );

      if (!wang_filteredPages.length) {
        wang_pageList.innerHTML = '<div class="wang_empty">没有找到匹配的网页作品</div>';
        return;
      }

      wang_pageList.innerHTML = wang_filteredPages.map(wang_page => `
        <a class="wang_page-card"
           href="${wang_page.file}"
           target="_blank"
           rel="noopener noreferrer">
          <div class="wang_icon">${wang_page.icon}</div>
          <h3>${wang_page.title}</h3>
          <span>${wang_page.file}　↗</span>
        </a>
      `).join("");
    }

    wang_search.addEventListener("input", wang_event => {
      wang_renderPages(wang_event.target.value);
    });

    document.getElementById("wang_year").textContent = new Date().getFullYear();
    wang_renderPages();
  </script>
</body>
</html>
