<!DOCTYPE html>
<!-- 姓名：王秀宁，日期：2026-10-22，功能名称：《高级网页设计》课堂实践首页导航 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王秀宁《高级网页设计》课堂实践</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #25233a;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #f2f0ff, #fff5fa);
    }

    header {
      padding: 75px 20px 110px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #5148bf, #a26bd8);
      clip-path: ellipse(100% 72% at 50% 25%);
    }

    header h1 {
      margin: 20px 0 12px;
      font-size: clamp(30px, 6vw, 56px);
      letter-spacing: 3px;
    }

    header p {
      font-size: 17px;
      opacity: .9;
    }

    .wxn_badge {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,.6);
      border-radius: 999px;
      letter-spacing: 2px;
    }

    main {
      width: min(1100px, 92%);
      margin: -45px auto 60px;
    }

    .wxn_intro,
    .wxn_prompt {
      padding: 28px;
      margin-bottom: 26px;
      border-radius: 24px;
      background: rgba(255,255,255,.85);
      box-shadow: 0 18px 45px rgba(68,55,140,.14);
    }

    .wxn_intro {
      color: #747188;
      text-align: center;
      line-height: 2;
    }

    .wxn_title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 25px 0 18px;
    }

    .wxn_title-row h2 {
      font-size: 25px;
    }

    #wxn_search {
      width: 260px;
      max-width: 100%;
      padding: 12px 18px;
      border: 1px solid #dedaf3;
      border-radius: 999px;
      outline: none;
      font-size: 14px;
    }

    #wxn_search:focus {
      border-color: #6257d9;
      box-shadow: 0 0 0 4px rgba(98,87,217,.12);
    }

    .wxn_page-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .wxn_page-card {
      display: flex;
      flex-direction: column;
      min-height: 175px;
      padding: 25px;
      color: #25233a;
      text-decoration: none;
      border: 1px solid #eeeafa;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 25px rgba(68,55,140,.08);
      transition: .25s ease;
    }

    .wxn_page-card:hover {
      color: #fff;
      transform: translateY(-7px);
      background: linear-gradient(135deg, #6257d9, #9b8cff);
      box-shadow: 0 18px 30px rgba(98,87,217,.28);
    }

    .wxn_icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #6257d9, #9b8cff);
      font-size: 22px;
    }

    .wxn_page-card:hover .wxn_icon {
      background: rgba(255,255,255,.2);
    }

    .wxn_page-card h3 {
      margin-bottom: 12px;
      font-size: 19px;
    }

    .wxn_page-card span {
      margin-top: auto;
      color: #858198;
      font-size: 13px;
    }

    .wxn_page-card:hover span {
      color: rgba(255,255,255,.85);
    }

    .wxn_prompt h2 {
      margin-bottom: 14px;
      font-size: 20px;
    }

    .wxn_prompt p {
      padding: 16px;
      color: #5c5872;
      line-height: 1.8;
      border-left: 4px solid #6257d9;
      background: #f7f6ff;
      word-break: break-all;
    }

    footer {
      padding: 25px;
      color: #747188;
      text-align: center;
      font-size: 14px;
    }

    .wxn_empty {
      grid-column: 1 / -1;
      padding: 35px;
      color: #747188;
      text-align: center;
    }

    @media (max-width: 600px) {
      .wxn_title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      #wxn_search {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wxn_badge">CLASS PRACTICE</div>
    <h1>高级网页设计</h1>
    <p>王秀宁课堂实践作品集</p>
  </header>

  <main>
    <section class="wxn_intro">
      <p>
        欢迎来到王秀宁《高级网页设计》课堂实践导航页。<br>
        以下为本目录中的网页作品，点击卡片将在新窗口打开对应页面。
      </p>
    </section>

    <div class="wxn_title-row">
      <h2>网页作品导航</h2>
      <input id="wxn_search" type="search" placeholder="搜索作品名称或文件名">
    </div>

    <section class="wxn_page-list" id="wxn_pageList"></section>

    <section class="wxn_prompt">
      <h2>本页面提示词</h2>
      <p>
        创建一个新页面，包括本目录下的所有网页的超链接，使用原生代码，不使用cdn，新页面名称为index.html，主题为王秀宁的《高级网页设计》课堂实践，美化页面，页面中包括本提示词，把作品名改成每个文件h2中的内容，每个网页超链接要target="_blank"
      </p>
    </section>
  </main>

  <footer>
    © <span id="wxn_year"></span> 王秀宁《高级网页设计》课堂实践
  </footer>

  <script>
    const wxn_pages = [

      {

        title: "图层样式表css",
        icon: "✧"
      },
        {
        file: "./5.html",
        title: "css群组选择器和后代选择器",
        icon: "✧"
      },
      {
        file: "./7-1.html",
        title: "盒模型，框模型，box model",
        icon: "▣"
      },
      {

        title: "层叠与继承",

      {
        file: "./8-2.html",
        title: "王秀宁的标题",

      },
      {

        icon: "◑"

      {
        file: "./11-4.html",
        title: "Media Query 响应式布局",
        icon: "▦"
      },
      {
        file: "./12-1.html",
        title: "前端长度单位",
        icon: "↔"
      },
      {

        icon: "◌"
      },
      {

        icon: "✦"
      },
      {

      {

        title: "新闻 Tab 选项卡（投诉/回应/调查）",
        icon: "🗂"
      }
    ];

    const wxn_pageList = document.getElementById("wxn_pageList");
    const wxn_search = document.getElementById("wxn_search");

    function wxn_renderPages(wxn_keyword = "") {
      const wxn_filteredPages = wxn_pages.filter(wxn_page =>
        wxn_page.title.toLowerCase().includes(wxn_keyword.toLowerCase()) ||
        wxn_page.file.toLowerCase().includes(wxn_keyword.toLowerCase())
      );

      if (!wxn_filteredPages.length) {
        wxn_pageList.innerHTML = '<div class="wxn_empty">没有找到匹配的网页作品</div>';
        return;
      }

      wxn_pageList.innerHTML = wxn_filteredPages.map(wxn_page => `
        <a class="wxn_page-card"
           href="${wxn_page.file}"
           target="_blank"
           rel="noopener noreferrer">
          <div class="wxn_icon">${wxn_page.icon}</div>
          <h3>${wxn_page.title}</h3>
          <span>${wxn_page.file}　↗</span>
        </a>
      `).join("");
    }

    wxn_search.addEventListener("input", wxn_event => {
      wxn_renderPages(wxn_event.target.value);
    });

    document.getElementById("wxn_year").textContent = new Date().getFullYear();
    wxn_renderPages();
  </script>
</body>
</html>
