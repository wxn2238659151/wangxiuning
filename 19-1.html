<!DOCTYPE html>
<!-- 姓名：王秀宁，日期：2026-11-05，功能名称：Canvas 文字衰落动画（文字下落并逐渐消散） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>19-1 Canvas 文字衰落动画</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    .wxn_page-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #7dd3fc;
    }
    .wxn_page-desc {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .wxn_canvas-box {
      position: relative;
      width: 900px;
      max-width: 96vw;
      height: 560px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.45);
      border: 1px solid #334155;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .wxn_ctrl {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .wxn_ctrl input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #e2e8f0;
      width: 220px;
      outline: none;
    }
    .wxn_btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      background: #0ea5e9;
      color: #fff;
      transition: background .2s;
    }
    .wxn_btn:hover { background: #0284c7; }
    .wxn_btn--ghost { background: #475569; }
    .wxn_btn--ghost:hover { background: #64748b; }
    .wxn_back {
      margin-top: 24px;
      color: #7dd3fc;
      text-decoration: none;
      font-size: 14px;
    }
    .wxn_back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1 class="wxn_page-title">Canvas 文字衰落动画</h1>
  <p class="wxn_page-desc">文字从上方缓缓飘落，边下落边旋转、放大并逐渐衰弱消散 —— 输入文字后点击按钮发射</p>

  <div class="wxn_canvas-box">
    <canvas id="wxn_canvas"></canvas>
  </div>

  <div class="wxn_ctrl">
    <input id="wxn_input" type="text" maxlength="12" placeholder="输入要飘落的文字，如：电商狂欢节">
    <button class="wxn_btn" id="wxn_btnStart">发射文字</button>
    <button class="wxn_btn wxn_btn--ghost" id="wxn_btnClear">清空画布</button>
  </div>

  <a class="wxn_back" href="./index.html">← 返回首页</a>

  <script>
    (function () {
      var wxn_canvas = document.getElementById('wxn_canvas');
      var wxn_ctx = wxn_canvas.getContext('2d');

      // 让画布尺寸与容器实际显示尺寸保持一致（高分屏适配）
      function wxn_resize() {
        var wxn_rect = wxn_canvas.parentElement.getBoundingClientRect();
        wxn_canvas.width = wxn_rect.width;
        wxn_canvas.height = wxn_rect.height;
      }
      wxn_resize();
      window.addEventListener('resize', wxn_resize);

      // 衰落文字粒子：位置、速度、旋转、透明度、生命周期
      var wxn_texts = [];

      var wxn_colorPool = ['#7dd3fc', '#f0abfc', '#fde68a', '#86efac', '#fca5a5', '#c4b5fd'];

      function wxn_spawn(text) {
        var wxn_word = (text && text.trim()) ? text.trim() : '文字衰落';
        var wxn_chars = wxn_word.split('');
        var wxn_baseX = wxn_canvas.width * (0.25 + Math.random() * 0.5);
        // 整句拆成单字，带一点水平偏移依次发射
        wxn_chars.forEach(function (ch, i) {
          wxn_texts.push({
            ch: ch,
            x: wxn_baseX + i * 46,
            y: -40 - i * 30,
            vy: 0.4 + Math.random() * 0.6,   // 下落速度
            vx: (Math.random() - 0.5) * 0.4, // 轻微横向漂移
            rot: (Math.random() - 0.5) * 0.4,
            vr: (Math.random() - 0.5) * 0.02,
            size: 26 + Math.random() * 18,
            grow: 0.05 + Math.random() * 0.05,
            alpha: 1,
            decay: 0.0025 + Math.random() * 0.002, // 衰落速度
            color: wxn_colorPool[Math.floor(Math.random() * wxn_colorPool.length)]
          });
        });
      }

      // 背景细雨般的装饰字符
      var wxn_rain = [];
      var wxn_rainChars = '高 级 网 页 设 计 Canvas 动 画 文 字 衰 落'.split(' ');
      for (var wxn_i = 0; wxn_i < 40; wxn_i++) {
        wxn_rain.push({
          ch: wxn_rainChars[Math.floor(Math.random() * wxn_rainChars.length)],
          x: Math.random(),
          y: Math.random(),
          v: 0.001 + Math.random() * 0.002,
          size: 12 + Math.random() * 10,
          alpha: 0.05 + Math.random() * 0.12
        });
      }

      function wxn_update() {
        wxn_ctx.clearRect(0, 0, wxn_canvas.width, wxn_canvas.height);

        // 1. 背景装饰字符（恒定缓慢下落）
        wxn_ctx.textAlign = 'center';
        wxn_ctx.textBaseline = 'middle';
        wxn_rain.forEach(function (r) {
          r.y += r.v;
          if (r.y > 1.05) { r.y = -0.05; r.x = Math.random(); }
          wxn_ctx.globalAlpha = r.alpha;
          wxn_ctx.fillStyle = '#64748b';
          wxn_ctx.font = r.size + 'px "Microsoft YaHei", sans-serif';
          wxn_ctx.fillText(r.ch, r.x * wxn_canvas.width, r.y * wxn_canvas.height);
        });

        // 2. 主角：衰落文字
        for (var wxn_j = wxn_texts.length - 1; wxn_j >= 0; wxn_j--) {
          var wxn_t = wxn_texts[wxn_j];
          wxn_t.y += wxn_t.vy;
          wxn_t.vy += 0.01;              // 重力加速
          wxn_t.x += wxn_t.vx;
          wxn_t.rot += wxn_t.vr;
          wxn_t.size += wxn_t.grow;      // 逐渐放大
          wxn_t.alpha -= wxn_t.decay;    // 逐渐衰弱

          if (wxn_t.alpha <= 0 || wxn_t.y > wxn_canvas.height + 80) {
            wxn_texts.splice(wxn_j, 1);
            continue;
          }

          wxn_ctx.save();
          wxn_ctx.globalAlpha = Math.max(wxn_t.alpha, 0);
          wxn_ctx.translate(wxn_t.x, wxn_t.y);
          wxn_ctx.rotate(wxn_t.rot);
          wxn_ctx.fillStyle = wxn_t.color;
          wxn_ctx.shadowColor = wxn_t.color;
          wxn_ctx.shadowBlur = 12;
          wxn_ctx.font = 'bold ' + wxn_t.size + 'px "Microsoft YaHei", sans-serif';
          wxn_ctx.fillText(wxn_t.ch, 0, 0);
          wxn_ctx.restore();
        }

        wxn_ctx.globalAlpha = 1;
        requestAnimationFrame(wxn_update);
      }
      requestAnimationFrame(wxn_update);

      // 控制交互
      var wxn_input = document.getElementById('wxn_input');
      var wxn_btnStart = document.getElementById('wxn_btnStart');
      var wxn_btnClear = document.getElementById('wxn_btnClear');

      wxn_btnStart.addEventListener('click', function () {
        wxn_spawn(wxn_input.value);
      });
      wxn_input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') wxn_spawn(wxn_input.value);
      });
      wxn_btnClear.addEventListener('click', function () {
        wxn_texts.length = 0;
      });

      // 页面加载后自动演示一次
      wxn_spawn('文字衰落');
    })();
  </script>
</body>
</html>
