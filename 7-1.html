<!DOCTYPE html>
<!-- 姓名：王秀宁，日期：2026-10-22，功能名称：CSS 盒模型 box model 练习 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型，框模型，box model</title>
    <style>
        body,ul,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        /*尽量少用通配符*/
        ul{
            list-style: none;
        }
        .wang_a{
            width: 500px;
            height: 500px;
            border: 2px dotted red;
            padding: 70px 60px 50px 40px;/*上 下 左 右*/
            margin: 40px auto;
            /*上下 左右，左右margin为auto时，盒子居中*/
        }
        /*盒子的高度：内容高度+上下边框的高度+上下padding的高度+上下margin的高度*/
        .wang_b{
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
            margin: 50px auto 40px;

        }
        .wang_c{
            width: 200px;
            height: 200px;
            border: 2px solid #039;
            margin: 20px auto;

        }
    </style>
</head>
<body>
    <div class="wang_a">629 王秀宁</div>
    <div class="wang_b">629 王秀宁</div>
    <div class="wang_c">629 王秀宁</div>
</body>
</html>
