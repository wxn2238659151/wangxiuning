<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Media Query 响应式布局</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 32px 16px;
			background: #f2f4f1;
			color: #182b27;
			font-family: "Microsoft YaHei", sans-serif;
		}

		main {
			width: min(100%, 1200px);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 24px;
			font-size: 28px;
		}

		.wang_boxes {
			display: grid;
			gap: 12px;
		}

		.wang_box {
			display: grid;
			min-height: 112px;
			place-items: center;
			border-radius: 8px;
			color: #fff;
			font-size: 20px;
			font-weight: 700;
			animation: shape-change 4s linear infinite;
		}

		.wang_box:nth-child(4n + 1) { background: #980ce4; }
		.wang_box:nth-child(4n + 2) { background: #bd593b; }
		.wang_box:nth-child(4n + 3) { background: #2570c7; }
		.wang_box:nth-child(4n) { background: #189a89; }

		@keyframes shape-change {
			0% {
				border-radius: 8px;
			}
			50% {
				border-radius: 50%;
			}
			100% {
				border-radius: 8px;
			}
		}

		@media (max-width: 479px) {
			.wang_boxes {
				grid-template-columns: minmax(0, 1fr);
			}
		}

		@media (min-width: 480px) {
			.wang_boxes {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}

			.wang_box {
				font-size: 18px;
			}
		}

		@media (min-width: 760px) {
			.wang_boxes {
				grid-template-columns: repeat(4, minmax(0, 1fr));
			}

			.wang_box {
				font-size: 16px;
			}
		}

		@media (min-width: 1100px) {
			.wang_boxes {
				grid-template-columns: repeat(8, minmax(0, 1fr));
			}

			.wang_box {
				font-size: 14px;
			}
		}
	</style>
</head>
<body>
	<main>
		<h1>王秀宁</h1>
		<section class="wang_boxes" aria-label="八个响应式盒子">
			<div class="wang_box">盒子 1 王秀宁</div>
			<div class="wang_box">盒子 2 王秀宁</div>
			<div class="wang_box">盒子 3 王秀宁</div>
			<div class="wang_box">盒子 4 王秀宁</div>
			<div class="wang_box">盒子 5 王秀宁</div>
			<div class="wang_box">盒子 6 王秀宁</div>
			<div class="wang_box">盒子 7 王秀宁</div>
			<div class="wang_box">盒子 8 王秀宁</div>
		</section>
	</main>
</body>
</html>
