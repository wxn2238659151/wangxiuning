<!DOCTYPE html>
<!-- 姓名：王秀宁，日期：2026-11-02，功能名称：Promise 与 async/await 演示包饺子异步流程 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18-6 Promise 与 async/await 包饺子异步流程演示</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: #2b2a3d;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #fff7ee, #fdeef0);
    }

    header {
      padding: 45px 20px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #c8532e, #e8913f);
      clip-path: ellipse(100% 80% at 50% 20%);
    }

    header h1 {
      margin-bottom: 10px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      font-size: 14px;
      opacity: .9;
    }

    .wxn_tip {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 16px;
      border: 1px dashed rgba(255, 255, 255, .6);
      border-radius: 999px;
      font-size: 13px;
    }

    main {
      width: min(1000px, 92%);
      margin: 30px auto 60px;
    }

    .wxn_toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .wxn_toolbar h2 {
      font-size: 20px;
    }

    .wxn_btn {
      padding: 10px 22px;
      color: #fff;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #c8532e, #e8913f);
      font-size: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .wxn_btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(200, 83, 46, .35);
    }

    .wxn_btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 流程步骤卡片 */
    .wxn_steps {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .wxn_step {
      padding: 18px 16px;
      border: 1px solid #f3e2d3;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(160, 90, 40, .08);
      text-align: center;
      transition: .3s;
    }

    .wxn_step-icon {
      font-size: 34px;
      margin-bottom: 8px;
      filter: grayscale(1);
      opacity: .45;
      transition: .3s;
    }

    .wxn_step h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }

    .wxn_step-time {
      color: #8d8798;
      font-size: 12px;
    }

    .wxn_step-state {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: #8d8798;
      background: #f3f1f6;
    }

    .wxn_step.wxn_waiting {
      border-style: dashed;
    }

    .wxn_step.wxn_doing {
      border-color: #e8913f;
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(232, 145, 63, .3);
    }

    .wxn_step.wxn_doing .wxn_step-icon {
      filter: none;
      opacity: 1;
      animation: wxn_shake 1s ease-in-out infinite;
    }

    .wxn_step.wxn_doing .wxn_step-state {
      color: #fff;
      background: linear-gradient(135deg, #c8532e, #e8913f);
    }

    .wxn_step.wxn_done .wxn_step-icon {
      filter: none;
      opacity: 1;
    }

    .wxn_step.wxn_done .wxn_step-state {
      color: #1d8a4e;
      background: #e3f7ea;
    }

    @keyframes wxn_shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }

    /* 并行提示 */
    .wxn_parallel {
      padding: 14px 18px;
      margin-bottom: 24px;
      color: #7a5230;
      font-size: 13px;
      line-height: 1.9;
      border: 1px dashed #ecc79e;
      border-radius: 14px;
      background: #fffaf3;
    }

    .wxn_parallel b {
      color: #c8532e;
    }

    /* 日志面板 */
    .wxn_log-panel {
      overflow: hidden;
      border-radius: 16px;
      background: #2f2a3d;
      box-shadow: 0 10px 25px rgba(47, 42, 61, .25);
    }

    .wxn_log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      color: #f5efe6;
      font-size: 14px;
      background: rgba(255, 255, 255, .06);
    }

    .wxn_log-head span:last-child {
      font-size: 12px;
      opacity: .7;
    }

    .wxn_log {
      height: 240px;
      padding: 14px 18px;
      overflow-y: auto;
      color: #e9e2f5;
      font-size: 13px;
      font-family: Consolas, "Courier New", monospace;
      line-height: 2;
    }

    .wxn_log div {
      border-bottom: 1px dashed rgba(255, 255, 255, .08);
    }

    .wxn_log .wxn_time {
      color: #f0a95c;
      margin-right: 10px;
    }

    .wxn_log .wxn_ok {
      color: #7ee2a8;
    }

    .wxn_log .wxn_parallel-log {
      color: #8fc7ff;
    }

    .wxn_log .wxn_end {
      color: #ffd166;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Promise 与 async/await：包饺子流程演示</h1>
    <p>原生 JavaScript · setTimeout 模拟异步操作 · Promise.all 并行处理</p>
    <div class="wxn_tip">流程：买原料 → 取原料 →（和面 ∥ 和馅）→ 包饺子 → 吃饺子</div>
  </header>

  <main>
    <div class="wxn_toolbar">
      <h2>制作流程步骤</h2>
      <button class="wxn_btn" id="wxn_start">开始包饺子 🥟</button>
    </div>

    <section class="wxn_steps" id="wxn_steps"></section>

    <div class="wxn_parallel">
      <b>异步知识点说明：</b>买原料、取原料是先后执行的串行异步任务（await 依次等待）；
      和面与和馅互不依赖，用 <b>Promise.all</b> <b>同时</b>进行，等两者都完成才进入下一步；
      所有耗时操作均用 <b>setTimeout</b> 模拟（如买原料 6 秒）。
    </div>

    <div class="wxn_log-panel">
      <div class="wxn_log-head">
        <span>流程日志</span>
        <span>时间轴（秒）</span>
      </div>
      <div class="wxn_log" id="wxn_log">
        <div>点击右上角按钮开始包饺子…</div>
      </div>
    </div>
  </main>

  <script>
    // 步骤配置：每步用 setTimeout 模拟耗时
    const wxn_STEPS = [
      { id: "buy",    name: "买原料", icon: "🛒", time: 6 },
      { id: "take",   name: "取原料", icon: "📦", time: 2 },
      { id: "dough",  name: "和面",   icon: "🫓", time: 4 },
      { id: "fill",   name: "和馅",   icon: "🥬", time: 3 },
      { id: "wrap",   name: "包饺子", icon: "🥟", time: 5 },
      { id: "eat",    name: "吃饺子", icon: "😋", time: 2 }
    ];

    const wxn_stepsEl = document.getElementById("wxn_steps");
    const wxn_logEl = document.getElementById("wxn_log");
    const wxn_startBtn = document.getElementById("wxn_start");

    // 记录流程开始时间，用于日志显示时间轴
    let wxn_startTime = 0;

    // 渲染步骤卡片
    function wxn_renderSteps() {
      wxn_stepsEl.innerHTML = wxn_STEPS.map(function (wxn_s) {
        return `
          <div class="wxn_step wxn_waiting" id="wxn_step-${wxn_s.id}">
            <div class="wxn_step-icon">${wxn_s.icon}</div>
            <h3>${wxn_s.name}</h3>
            <div class="wxn_step-time">耗时约 ${wxn_s.time} 秒</div>
            <span class="wxn_step-state">等待中</span>
          </div>
        `;
      }).join("");
    }

    // 更新某个步骤的状态
    function wxn_setState(wxn_id, wxn_state, wxn_text) {
      const wxn_card = document.getElementById("wxn_step-" + wxn_id);
      wxn_card.classList.remove("wxn_waiting", "wxn_doing", "wxn_done");
      wxn_card.classList.add(wxn_state);
      wxn_card.querySelector(".wxn_step-state").textContent = wxn_text;
    }

    // 追加一条日志
    function wxn_addLog(wxn_msg, wxn_class) {
      const wxn_sec = ((Date.now() - wxn_startTime) / 1000).toFixed(1);
      const wxn_row = document.createElement("div");
      wxn_row.innerHTML = `<span class="wxn_time">[${wxn_sec}s]</span><span class="${wxn_class || ""}">${wxn_msg}</span>`;
      wxn_logEl.appendChild(wxn_row);
      wxn_logEl.scrollTop = wxn_logEl.scrollHeight;
    }

    // 用 Promise 包装 setTimeout：time 秒后任务完成
    function wxn_delay(wxn_name, wxn_time) {
      wxn_addLog(`开始「${wxn_name}」，预计 ${wxn_time} 秒…`);
      return new Promise(function (wxn_resolve) {
        setTimeout(function () {
          wxn_resolve(wxn_name);
        }, wxn_time * 1000);
      });
    }

    // 和面与和馅并行执行，完成后一起返回
    function wxn_prepareTogether() {
      wxn_setState("dough", "wxn_doing", "进行中");
      wxn_setState("fill", "wxn_doing", "进行中");
      return Promise.all([
        wxn_delay("和面", 4),
        wxn_delay("和馅", 3)
      ]);
    }

    // 用 async/await 按顺序组织整个流程
    async function wxn_makeDumplings() {
      wxn_startBtn.disabled = true;
      wxn_logEl.innerHTML = "";
      wxn_renderSteps();
      wxn_startTime = Date.now();

      try {
        // 1. 买原料（串行）
        wxn_setState("buy", "wxn_doing", "进行中");
        await wxn_delay("买原料", 6);
        wxn_setState("buy", "wxn_done", "已完成");
        wxn_addLog("✅ 买原料完成！", "wxn_ok");

        // 2. 取原料（串行，依赖买原料）
        wxn_setState("take", "wxn_doing", "进行中");
        await wxn_delay("取原料", 2);
        wxn_setState("take", "wxn_done", "已完成");
        wxn_addLog("✅ 取原料完成！", "wxn_ok");

        // 3. 和面 + 和馅（Promise.all 并行）
        wxn_addLog("⏳ 和面与和馅同时开始（Promise.all 并行）…", "wxn_parallel-log");
        const wxn_results = await wxn_prepareTogether();
        wxn_setState("dough", "wxn_done", "已完成");
        wxn_setState("fill", "wxn_done", "已完成");
        wxn_addLog("✅ " + wxn_results.join("、") + " 都完成了！", "wxn_ok");

        // 4. 包饺子
        wxn_setState("wrap", "wxn_doing", "进行中");
        await wxn_delay("包饺子", 5);
        wxn_setState("wrap", "wxn_done", "已完成");
        wxn_addLog("✅ 包饺子完成，热腾腾的饺子出锅啦！", "wxn_ok");

        // 5. 吃饺子
        wxn_setState("eat", "wxn_doing", "进行中");
        await wxn_delay("吃饺子", 2);
        wxn_setState("eat", "wxn_done", "已完成");

        const wxn_total = ((Date.now() - wxn_startTime) / 1000).toFixed(1);
        wxn_addLog(`🎉 全部流程结束！总耗时约 ${wxn_total} 秒（和面和馅并行，节省了约 3 秒）`, "wxn_end");
      } catch (wxn_err) {
        wxn_addLog("❌ 流程出错：" + wxn_err.message, "wxn_end");
      } finally {
        wxn_startBtn.disabled = false;
        wxn_startBtn.textContent = "再包一次 🥟";
      }
    }

    wxn_renderSteps();
    wxn_startBtn.addEventListener("click", wxn_makeDumplings);
  </script>
</body>
</html>
