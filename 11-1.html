<!DOCTYPE html>
<!-- 姓名：王秀宁，日期：2026-10-22，功能名称：CSS 背景颜色动画 -->
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>背景颜色动画</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			min-height: 100vh;
			margin: 0;
			align-items: center;
			justify-content: center;
		}

		.wang_box {
			width: 200px;
			height: 200px;
			animation: color-change 8s linear infinite;
		}

		@keyframes color-change {
			0% {
				background-color: #e74c3c;
				border-radius: 0;
				transform: rotate(0deg);
			}
			25% {
				background-color: #f39c12;
				border-radius: 20%;
				transform: rotate(0deg);
			}
			50% {
				background-color: #16a085;
				border-radius: 50%;
				transform: rotate(0deg);
			}
			75% {
				background-color: #3498db;
				border-radius: 0;
				transform: rotate(45deg);
			}
			100% {
				background-color: #e74c3c;
				border-radius: 0;
				transform: rotate(0deg);
			}
		}
	</style>
</head>
<body>
	<div class="wang_box"></div>
</body>
</html>
